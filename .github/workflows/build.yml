name: Build Wave12
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cài Theos + ldid + SDK iOS 12.4
        run: |
          brew install ldid dpkg
          git clone --recursive --depth 1 https://github.com/theos/theos.git $HOME/theos
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git $HOME/sdks
          (cd $HOME/sdks && git sparse-checkout set iPhoneOS12.4.sdk)
          rm -rf $HOME/theos/sdks && ln -s $HOME/sdks $HOME/theos/sdks
      - name: Build .deb
        run: |
          export THEOS=$HOME/theos
          make package FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: Wave12-deb
          path: packages/*.deb
